name: bundles

# Mirror pinned Java + wasm artifacts into R2 via the shared
# `bundling` CLI (packages/bundling). The whole pipeline is pin-driven and
# idempotent: putIfMissing HEAD-checks each key, so reruns are no-ops.
# There is no "latest" tag — every object is immutable at <kind>/<pin>/.
#
# Secrets required (repo-level):
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/bundling/**"
      - ".github/workflows/bundles.yml"

concurrency:
  group: bundles
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run bundle pipeline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm tsx packages/bundling/bin/cli.ts ci

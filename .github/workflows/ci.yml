name: CI

run-name: >-
  CI —
  ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
   || startsWith(github.ref, 'refs/tags/release-') && format('release {0}', github.ref_name)
   || github.event_name == 'workflow_dispatch' && format('manual (skip_unit={0}, skip_pw={1})', inputs.skip_unit_tests, inputs.skip_playwright)
   || format('push {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    tags: ["release-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_unit_tests:
        description: "Skip the cargo unit test job"
        type: boolean
        default: false
      skip_playwright:
        description: "Skip the Playwright e2e job"
        type: boolean
        default: false

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.skip_unit_tests != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: Run tests
        run: just test

  build:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build runtime wasm (release)
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_TARGET_WASM32_WASIP2_RUSTFLAGS: "-C link-arg=-zstack-size=8388608"
        run: cargo build --release -p runtime --target wasm32-wasip2

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-wasm
          path: target/wasm32-wasip2/release/runtime.wasm
          if-no-files-found: error

  playwright:
    needs: build
    if: |
      always()
      && needs.build.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.skip_playwright != true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: target/wasm32-wasip2/release

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Transpile runtime component
        run: pnpm --filter '@learnrobotics/runtime' build

      # Playwright drives the real dev server; the playground route imports
      # @learnrobotics/teavm-compiler/compiler.wasm?url, which is staged here.
      - name: Stage teavm artifacts
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm tsx packages/bundling/bin/cli.ts stage-teavm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  deploy:
    # Playwright is informational — don't block preview/production deploys
    # on flaky e2e. If you want to gate on it, use branch protection on
    # the `playwright` job's status check instead.
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: runtime-wasm
          path: target/wasm32-wasip2/release

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Transpile runtime component
        run: pnpm --filter '@learnrobotics/runtime' build

      # The vite build imports @learnrobotics/teavm-compiler/compiler.wasm?url;
      # that directory is populated by `stage-teavm` from the pinned R2 copy.
      - name: Stage teavm artifacts
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm tsx packages/bundling/bin/cli.ts stage-teavm

      # Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy preview (main)
        if: github.ref == 'refs/heads/main'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run deploy

      - name: Deploy production (release tag)
        if: startsWith(github.ref, 'refs/tags/release-')
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run deploy:production

      - name: Build only (PR)
        if: github.event_name == 'pull_request'
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build

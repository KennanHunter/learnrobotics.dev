name: Release

run-name: Release — ${{ inputs.commit && format('commit {0}', inputs.commit) || format('ref {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to release (defaults to the ref this workflow was dispatched on)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Compute release tag
        id: tag
        run: echo "tag=release-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ inputs.commit || github.sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes

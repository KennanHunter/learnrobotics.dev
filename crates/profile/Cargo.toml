[package]
name = "profile"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "profile"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "40", features = ["component-model", "async"] }
wasmtime-wasi = "40"
wasmtime-wasi-http = "40"
tokio = { version = "1", features = ["rt", "macros", "time"] }
anyhow = "1"
